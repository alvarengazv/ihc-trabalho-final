<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ações do Gemini · UX-Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--ui:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",Consolas,ui-monospace,monospace;
  --bg:#eef2ef;--surface:#fff;--surface-2:#f5f8f6;--ink:#14302a;--muted:#55716a;--faint:#8aa199;--line:#d6e0db;--line-strong:#b7c7c0;
  --green:#0f573e;--green-700:#0b4431;--green-50:#e7f1ec;--focus:#c2560c;--radius:14px;--radius-sm:9px;
  --shadow:0 1px 2px rgb(16 37 30 / .05),0 4px 16px rgb(16 37 30 / .06);
  font:16px/1.5 var(--ui);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
body{margin:0}
.mast{background:linear-gradient(180deg,#143a2e,#10291f);color:#fff}
.mast div,main{max-width:1120px;margin:auto;padding-inline:clamp(12px,3vw,32px)}
.mast div{display:flex;align-items:center;gap:12px;min-height:60px}
.logo{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 210deg,#9fd1b4,#3f9a72,#0f573e,#9fd1b4);box-shadow:inset 0 0 0 5px #143a2e,0 0 0 1px #2f6a55}
.mast b{font-weight:800;font-size:1.18rem;letter-spacing:-.03em}
.mast span:last-child{font-size:.86rem;color:#b9d2c7;border-left:1px solid #3d6a5a;padding-left:12px}
main{padding-block:28px 40px}
h1,h2{line-height:1.2;margin:0}h1{font-size:clamp(1.8rem,3.6vw,2.6rem);font-weight:800;margin:0 0 20px;letter-spacing:-.035em}
h2{font-size:1rem;font-weight:700;margin:0 0 12px}p{margin:0 0 10px}
header,.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
header{display:flex;flex-wrap:wrap;align-items:end;gap:12px}
label{display:grid;gap:6px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
select,button{font:inherit;font-size:.94rem;min-height:44px;max-width:100%;padding:8px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink)}
select{font-family:var(--mono);font-size:.86rem}
button{cursor:pointer;font-weight:600;background:var(--green);border-color:var(--green);color:#fff}
button:hover:not(:disabled){background:var(--green-700)}button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.following{display:flex;align-items:center;align-self:center;gap:8px;font-weight:500;color:var(--ink)}
.following input{accent-color:var(--green);width:18px;height:18px}
#status{margin:14px 0;min-height:24px;font-weight:600;color:var(--muted)}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.panel{min-width:0;margin-bottom:16px}
#answer{font:600 1rem/1.5 var(--mono);color:var(--green);background:var(--green-50);border:1px solid #c7e0d3;border-radius:var(--radius-sm);padding:10px 12px;overflow-wrap:anywhere;white-space:pre-wrap}
#execution,#timing{font-size:.9rem;color:var(--muted)}
ol{margin:0;padding-left:30px}li{margin-block:5px;overflow-wrap:anywhere}
.gesture{margin-left:8px;font:600 .74rem var(--mono);color:var(--green);background:var(--green-50);border:1px solid #c7e0d3;border-radius:6px;padding:1px 6px}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--green);padding:6px 0}
pre{padding:12px;background:#f3f6f4;border:1px solid var(--line);border-radius:var(--radius-sm);white-space:pre-wrap;overflow-wrap:anywhere;max-height:430px;overflow:auto;font:.78rem/1.55 var(--mono)}
@media(max-width:640px){.columns{grid-template-columns:1fr}header{align-items:start}}
</style>
<div class="mast"><div><span class="logo" aria-hidden="true"></span><b>UX-Agent</b><span>Registro do piloto Gemini</span></div></div>
<main>
<h1>Ações do Gemini</h1>
<header>
  <label>Sessão<select id="session" aria-label="Sessão de calibração"></select></label>
  <label>Passo e tentativa<select id="step" aria-label="Passo e tentativa"></select></label>
  <button type="button" id="prev">Anterior</button>
  <button type="button" id="next">Próximo</button>
  <label class="following"><input type="checkbox" checked id="follow"> Acompanhar último passo</label>
</header>
<p id="status" role="status"></p>
<div id="content" hidden>
  <div class="columns">
    <section class="panel">
      <h2>O que o Gemini recebeu</h2>
      <ol id="view"></ol>
      <details><summary>Memória e ações disponíveis</summary><pre id="memory"></pre></details>
    </section>
    <section class="panel">
      <h2>Resposta do Gemini</h2>
      <p id="answer"></p>
      <p id="execution"></p>
      <p id="timing"></p>
      <details><summary>Requisição completa</summary><pre id="request"></pre></details>
      <details><summary>Resposta completa</summary><pre id="response"></pre></details>
    </section>
  </div>
</div>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const session = $("session"), step = $("step"), follow = $("follow");
let loading = false, selection = 0;
const formatted = value => JSON.stringify(value, null, 2);
function updateOptions(select, items, chosen, label = value => value) {
  if (items.join("|") !== [...select.options].map(o => o.value).join("|"))
    select.replaceChildren(...items.map(value => new Option(label(value), value)));
  if (chosen) select.value = chosen;
}
async function refresh() {
  if (loading) return;
  loading = true;
  const revision = selection;
  const query = new URLSearchParams();
  if (session.value) query.set("sessao", session.value);
  if (!follow.checked && step.value) query.set("passo", step.value);
  try {
    const reply = await fetch("/api/registro?" + query.toString(), {cache:"no-store"});
    if (!reply.ok) throw new Error("Não foi possível carregar os registros.");
    const data = await reply.json();
    if (revision !== selection) return;
    updateOptions(session, data.sessoes, data.sessao);
    updateOptions(step, data.passos, data.passo, key => key.split("-").map(Number).join(" · "));
    $("prev").disabled = !step.value || step.selectedIndex <= 0;
    $("next").disabled = !step.value || step.selectedIndex >= step.options.length - 1;
    const record = data.registro;
    $("content").hidden = !record;
    if (!record) {
      $("status").textContent = "Aguardando registros do piloto.";
      return;
    }
    const [number, attempt] = data.passo.split("-").map(Number);
    $("status").textContent = "Passo " + number + " · tentativa " + attempt +
      (data.desfecho ? " · " + ({falha_tecnica:"falha técnica", desistencia:"desistência", limite_atingido:"limite atingido"}[data.desfecho] || data.desfecho.replaceAll("_", " ")) : " · sem encerramento registrado");
    const observation = record.observacao;
    $("view").replaceChildren(...observation.vista.map(sign => {
      const row = document.createElement("li");
      row.append(document.createTextNode(sign.texto || "(" + sign.tipo + ")"));
      if (sign.gesto) {
        const tag = document.createElement("span");
        tag.className = "gesture"; tag.textContent = sign.gesto; row.append(tag);
      }
      return row;
    }));
    $("memory").textContent = formatted({memoria:observation.memoria, acoes:observation.acoes});
    $("answer").textContent = data.resposta || (record.falha
      ? "Falha de comunicação" + (record.status_http ? " · HTTP " + record.status_http : "")
      : "Resposta ainda não registrada.");
    const action = data.executada;
    $("execution").textContent = action ? "Executada: " + (action.gesto || action.acao) +
      " · origem " + action.origem : record.nova_tentativa_em_s != null
      ? "Nova tentativa no mesmo passo, após " + record.nova_tentativa_em_s.toLocaleString("pt-BR") + " s."
      : record.rejeicao ? "Ação rejeitada pelo controlador."
      : record.modelo_retornado ? "Proposta aceita pelo controlador." : "";
    $("timing").textContent = [record.modelo_retornado || record.modelo_solicitado,
      record.latencia_ms == null ? "" : record.latencia_ms + " ms"].filter(Boolean).join(" · ");
    $("request").textContent = formatted(record.requisicao);
    $("response").textContent = record.resposta ? formatted(record.resposta) : "Sem resposta registrada.";
  } catch (error) {
    $("status").textContent = error.message;
  } finally {
    loading = false;
    if (revision !== selection) refresh();
  }
}
function select() { selection++; refresh(); }
session.onchange = () => { step.value = ""; select(); };
step.onchange = () => { follow.checked = false; select(); };
follow.onchange = select;
for (const [id, offset] of [["prev",-1],["next",1]]) {
  $(id).onclick = () => { step.selectedIndex += offset; step.onchange(); };
}
refresh();
setInterval(refresh, 1800);
</script>
</html>
